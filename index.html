<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primal Astrology Sign Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="date"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.show {
            display: block;
        }

        .result h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 2em;
        }

        .result .sign-name {
            font-size: 3em;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .result .date-range {
            color: #555;
            font-size: 1.2em;
            margin: 15px 0;
        }

        .result a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .result a:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1em;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .result .sign-name {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 Primal Astrology</h1>
        <p class="subtitle">Discover your primal animal sign</p>

        <div class="input-group">
            <label for="birthdate">Enter Your Birth Date:</label>
            <input type="date" id="birthdate" min="1900-01-01" max="2044-12-31">
        </div>

        <button id="findSign" onclick="findPrimalSign()">Find My Primal Sign</button>

        <div id="loading" class="loading" style="display: none;">Loading...</div>
        <div id="error" class="error"></div>

        <div id="result" class="result">
            <h2>Your Primal Sign is:</h2>
            <div class="sign-name" id="signName"></div>
            <div class="date-range" id="dateRange"></div>
            <a id="signLink" href="#" target="_blank">Learn More About Your Sign</a>
        </div>
    </div>

    <script>
        let primalData = null;

        // Load the JSON data
        async function loadData() {
            try {
                const response = await fetch('primal_animals.json');
                primalData = await response.json();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('error').textContent = 'Error loading primal animals data';
            }
        }

        // Initialize on page load
        loadData();

        function findPrimalSign() {
            // Clear previous results
            document.getElementById('result').classList.remove('show');
            document.getElementById('error').textContent = '';

            const birthdateInput = document.getElementById('birthdate');
            const birthdate = birthdateInput.value;

            if (!birthdate) {
                document.getElementById('error').textContent = 'Please enter your birth date';
                return;
            }

            if (!primalData) {
                document.getElementById('error').textContent = 'Data is still loading, please try again';
                return;
            }

            const date = new Date(birthdate);
            const year = date.getFullYear();
            const month = date.getMonth() + 1; // JavaScript months are 0-indexed
            const day = date.getDate();

            // Check if year is in our data
            if (!primalData[year.toString()]) {
                document.getElementById('error').textContent =
                    `Sorry, we don't have data for year ${year}. Please choose a date between 1900 and 2044.`;
                return;
            }

            // Find the matching sign
            const yearData = primalData[year.toString()];
            let matchedSign = null;

            for (const sign of yearData) {
                if (isDateInRange(month, day, sign.start, sign.end)) {
                    matchedSign = sign;
                    break;
                }
            }

            if (matchedSign) {
                displayResult(matchedSign);
            } else {
                document.getElementById('error').textContent = 'Could not find a matching sign for this date';
            }
        }

        function isDateInRange(month, day, start, end) {
            // Create comparable numbers: MMDD
            const dateValue = month * 100 + day;
            const startValue = start.month * 100 + start.day;
            const endValue = end.month * 100 + end.day;

            if (startValue <= endValue) {
                // Normal range (doesn't cross year boundary)
                return dateValue >= startValue && dateValue <= endValue;
            } else {
                // Range crosses year boundary (e.g., Dec 22 - Jan 19)
                return dateValue >= startValue || dateValue <= endValue;
            }
        }

        function displayResult(sign) {
            document.getElementById('signName').textContent = sign.sign;

            const startDate = getMonthName(sign.start.month) + ' ' + sign.start.day;
            const endDate = getMonthName(sign.end.month) + ' ' + sign.end.day;
            document.getElementById('dateRange').textContent =
                `${startDate} - ${endDate}`;

            document.getElementById('signLink').href = sign.link;
            document.getElementById('result').classList.add('show');
        }

        function getMonthName(monthNum) {
            const months = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            return months[monthNum - 1];
        }

        // Allow pressing Enter to submit
        document.getElementById('birthdate').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                findPrimalSign();
            }
        });
    </script>
</body>
</html>
